<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Squad Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #2d4a2a; }
    body { display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
    .msg { color: #fff; text-align: center; padding: 2rem; }
    .msg h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .msg p { opacity: 0.8; font-size: 0.9rem; }
    .msg code { background: rgba(255,255,255,0.1); padding: 0.2rem 0.5rem; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="msg">
    <h1>⚽ Squad Manager</h1>
    <p>Servidor Next.js rodando em <code>localhost:3000</code></p>
    <p style="margin-top:1rem;font-size:0.8rem;opacity:0.6">
      Execute <code>npm run dev</code> no seu computador para jogar
    </p>
  </div>
</body>
</html>
